# SPDX-License-Identifier: AGPL-3.0-or-later
# En cada cambio de main y en cada pull request: revisa el código (Ruff y
# ESLint), pasa las pruebas y mide qué parte del programa recorren (ADR 0112;
# en las pull requests, ADR 0119). No publica: la web la publica
# solo el NAS (nas/), que tiene el estado y los registros. El NAS detecta los
# cambios de main en menos de un minuto (ADR 0005).
name: Proves

on:
  push:
    branches: [main]
  # Las propuestas de otros se comprueban antes de aceptarlas (ADR 0119).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy pillow ruff==0.17.1 coverage==7.16.2
      # Versiones fijas: una versión nueva con reglas nuevas no puede parar
      # la publicación sin que nadie haya tocado el código (ADR 0112).
      - name: Revisión del Python (Ruff)
        run: ruff check --output-format github .
      - name: Revisión del JavaScript (ESLint)
        run: |
          npm install --no-save --no-package-lock eslint@9.39.1 globals@16.5.0
          npx eslint web montflorit eslint.config.mjs
      - name: Pruebas, con la cobertura
        run: coverage run -m unittest discover -s tests -b
      # La cobertura se mide y se enseña, pero no para la publicación.
      - name: Cobertura
        run: |
          coverage report | tee cobertura.txt
          { echo '### Cobertura de las pruebas'; echo '```'; cat cobertura.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
